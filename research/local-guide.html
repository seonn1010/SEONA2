const FILTERS = [
  { id: "all", label: "전체" },
  { id: "meal", label: "식사" },
  { id: "cafe", label: "카페·디저트" },
  { id: "mon", label: "월요일 휴무" },
  { id: "late", label: "밤 11시 넘어 영업" },
  { id: "morning", label: "오전 10시 전 오픈" },
  { id: "cheap", label: "1만 원 이하 식사" },
];

let area = "yangnim";
let filter = "all";

function esc(s) {
  return String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function rich(s) {
  return esc(s)
    .replace(/미확인/g, '<span class="unk">미확인</span>')
    .replace(/ ?ⓚ/g, '<span class="src">카카오</span>')
    .replace(/ ?ⓝ/g, '<span class="src">네이버</span>')
    .replace(/\(([^()]*\/[^()]*)\)/g, '<span class="note">($1)</span>');
}
function matches(s) {
  if (filter === "all") return true;
  if (filter === "meal" || filter === "cafe") return s.kind === filter;
  return s.tags.includes(filter);
}

function renderChips() {
  const box = document.getElementById("chips");
  box.innerHTML = FILTERS.map((f) =>
    `<button class="chip" id="chip-${f.id}" data-f="${f.id}" aria-pressed="${f.id === filter}">${f.label}</button>`
  ).join("");
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const d = DATA[area];
  const rows = d.stores.filter((s) => matches(s) && (!q || (s.n + " " + s.c + " " + s.m.map((x) => x[0]).join(" ")).toLowerCase().includes(q)));
  document.getElementById("count").textContent = `${d.label} 15곳 중 ${rows.length}곳`;
  const list = document.getElementById("list");
  if (!rows.length) {
    list.innerHTML = '<p class="empty">조건에 맞는 가게가 없어요. 다른 조건을 눌러 보세요.</p>';
  } else {
    list.innerHTML = rows.map((s) => {
      const num = (s.p.match(/^[0-9][0-9-]+/) || [])[0];
      const phone = num
        ? `<span class="phone">${rich(s.p)} <button class="copy" data-copy="${num}">번호 복사</button></span>`
        : rich(s.p);
      const links = [`<a href="https://place.map.kakao.com/${s.k}" target="_blank" rel="noopener">카카오맵</a>`];
      if (s.nv) links.push(`<a href="https://m.place.naver.com/place/${s.nv}/home" target="_blank" rel="noopener">네이버지도</a>`);
      return `<article class="card">
        <div class="card-head"><h2>${esc(s.n)}</h2><span class="cat">${esc(s.c)}</span></div>
        <dl>
          <dt>영업</dt><dd>${rich(s.h)}</dd>
          <dt>휴무</dt><dd>${rich(s.o)}</dd>
          <dt>메뉴</dt><dd class="menu">${s.m.map(([a, b]) => `<div><span>${esc(a)}</span><span class="price">${rich(b)}</span></div>`).join("")}</dd>
          <dt>전화</dt><dd>${phone}</dd>
          <dt>주소</dt><dd>${rich(s.a)}</dd>
        </dl>
        <div class="links">${links.join("")}</div>
      </article>`;
    }).join("");
  }
  document.getElementById("info").innerHTML = `
    <h3>${d.label} 조사 방법</h3>
    <ul>${d.method.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>
    <p>표시: <span class="unk">미확인</span> 확인되지 않았거나 출처끼리 달라 정하지 못한 값${area === "dongmyeong" ? ' · <span class="src">카카오</span><span class="src">네이버</span> 한쪽 출처에서만 가져온 값' : ""}</p>
    <p class="note">BT 브레이크타임 · LO 라스트오더 · 확인 날짜 2026-11-12 · 지도 정보는 가게 사정에 따라 바뀔 수 있어요.</p>`;
}

function setArea(a) {
  area = DATA[a] ? a : "yangnim";
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.area === area)));
  if (location.hash.slice(1) !== area) history.replaceState(null, "", "#" + area);
  render();
}

document.querySelector(".tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-area]");
  if (b) setArea(b.dataset.area);
});
document.getElementById("chips").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-f]");
  if (!b) return;
  filter = b.dataset.f;
  renderChips();
  render();
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("list").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-copy]");
  if (!b) return;
  try {
    await navigator.clipboard.writeText(b.dataset.copy);
    b.textContent = "복사됨";
  } catch {
    const r = document.createRange();
    r.selectNodeContents(b.parentElement);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    b.textContent = "길게 눌러 복사";
  }
  setTimeout(() => { b.textContent = "번호 복사"; }, 1800);
});
window.addEventListener("hashchange", () => setArea(location.hash.slice(1)));

renderChips();
setArea(location.hash.slice(1) || "yangnim");
</script>
